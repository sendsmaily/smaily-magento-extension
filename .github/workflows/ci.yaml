name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: PHP 8.1 syntax (every PHP and PHTML file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none

      - name: php -l every file outside vendor/
        run: bash bin/lint-php.sh

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, pdo_mysql, soap, xsl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Integration tests (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smaily_connect_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, pdo_mysql, soap, sodium, xsl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run integration tests
        run: vendor/bin/phpunit -c phpunit.integration.xml.dist
        env:
          SMAILY_IT_DB_HOST: 127.0.0.1
          SMAILY_IT_DB_PORT: '3306'
          SMAILY_IT_DB_USER: root
          SMAILY_IT_DB_PASSWORD: root
          SMAILY_IT_DB_NAME: smaily_connect_it

  static:
    name: Static analysis (phpcs + phpstan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, pdo_mysql, soap, xsl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: phpcs (Magento2 standard)
        run: vendor/bin/phpcs

      - name: phpstan
        run: vendor/bin/phpstan analyse --no-progress

  browser:
    name: Browser tests (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, pdo_mysql, soap, xsl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # The runner image ships Google Chrome; bin/test-js.sh names each failed
      # page and check at the end of its output.
      - name: Run the browser harnesses (Test/Js)
        run: |
          google-chrome --version
          bash bin/test-js.sh
        env:
          CHROME: google-chrome

  package:
    name: Release package (build + verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build and verify the release ZIP
        run: bash bin/verify-release-zip.sh smaily-connect-magento2.zip

      - name: Build and verify the Hyvä companion ZIP
        run: bash bin/verify-hyva-zip.sh smaily-connect-magento2-hyva.zip

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-zip
          path: |
            smaily-connect-magento2.zip
            smaily-connect-magento2.zip.sha256
          retention-days: 5

  # Magento's own compile step on the oldest and the newest supported Magento
  # (CON-210). Rc1–rc14 could not be compiled on 2.4.4 and nothing noticed
  # (CON-204). `setup:di:compile` needs only the enabled modules in
  # app/etc/config.php, no database and no search engine, so the job installs
  # Magento's code with composer and the extension from the release ZIP (what
  # a merchant gets), enables every module and compiles.
  compile:
    name: Magento compile (${{ matrix.magento }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The 2.4.4 line's last patch: plain 2.4.4 no longer installs as it
        # shipped, because its metapackages (MSI, reCAPTCHA) take any 1.x
        # module version, and today's need classes 2.4.4's framework lacks.
        # The patch releases pin every module.
        include:
          - magento: '2.4.4-p13'
            php: '8.1'
          - magento: '2.4.9'
            php: '8.4'
    env:
      MAGENTO_DIR: ${{ github.workspace }}/../magento
      ZIP_DIR: ${{ github.workspace }}/../smaily-zip
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, pdo_mysql, soap, sockets, sodium, xsl, zip
          ini-values: memory_limit=-1
          coverage: none

      - name: Locate the composer cache
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: magento-compile-${{ matrix.magento }}-php${{ matrix.php }}

      - name: Build the release ZIP
        run: |
          mkdir -p "$ZIP_DIR"
          bash bin/build-release-zip.sh "$ZIP_DIR/smaily-connect-magento2.zip"

      # The project's composer.json points at repo.magento.com, which needs
      # keys; the Mage-OS mirror serves the same packages without them. The
      # extension comes from the ZIP (an artifact repository). Composer would
      # refuse the old Magento's packages that have security advisories.
      - name: Create the Magento ${{ matrix.magento }} project
        run: |
          composer create-project --no-install --no-interaction \
            --repository-url=https://mirror.mage-os.org/ \
            "magento/project-community-edition=${{ matrix.magento }}" "$MAGENTO_DIR"
          cd "$MAGENTO_DIR"
          version="$(jq -r .version "$GITHUB_WORKSPACE/composer.json")"
          jq --arg zips "$ZIP_DIR" --arg version "$version" '
            .repositories = [
              {"type": "artifact", "url": $zips},
              {"type": "composer", "url": "https://mirror.mage-os.org/"}
            ]
            | .require["smaily/smailyformagento"] = $version
            | del(."require-dev")
            | .config["allow-plugins"] = true
            | .config.audit["block-insecure"] = false
          ' composer.json > composer.json.new
          mv composer.json.new composer.json
          composer update --no-interaction --no-progress

      - name: Enable the modules
        working-directory: ${{ env.MAGENTO_DIR }}
        run: |
          php bin/magento module:enable --all
          grep -q "'Smaily_Connect' => 1" app/etc/config.php

      - name: setup:di:compile
        working-directory: ${{ env.MAGENTO_DIR }}
        run: php bin/magento setup:di:compile
