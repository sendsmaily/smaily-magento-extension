<!--
  Headless harness for the landing capture (PRO-3911, PRO-3912, CON-177, CON-211): the Luma script
  (view/frontend/web/js/attribution.js) and the Hyvä script
  (compat/hyva/.../smaily-attribution.js), the real scripts, each landing in a
  fresh frame. Stubbed: the landing's query (a frame of a file:// page cannot
  change its address, so URLSearchParams reads the query given here),
  document.cookie (file:// pages keep no cookies; a cookie whose expiry has
  passed is removed, as a browser does), fetch() (the store route that sets
  the cookies: it answers, fails, or the network fails; each request is
  recorded) and, for Luma, RequireJS's define().
  Run it with bin/test-js.sh; the page ends with "RESULT: PASS" or
  "RESULT: FAIL".
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>attribution landing harness</title>
</head>
<body>
<pre id="log"></pre>
<div id="result">RESULT: RUNNING</div>
<script>
    'use strict';

    var REC_ID = '3fa85f64-5717-4562-b3fc-2c963f66afa6';
    var OLD_REC_ID = '0f8e3c1a-5b2d-4e6f-8a9b-1c2d3e4f5a6b';
    var failures = 0;
    var passes = 0;

    function log(line) {
        document.getElementById('log').textContent += line + '\n';
    }

    function check(label, condition) {
        if (condition) {
            passes++;
            log('ok   ' + label);
        } else {
            failures++;
            log('FAIL ' + label);
        }
    }

    // The defaults of Engine\AttributionManager::getClientConfig().
    var CONFIG = {
        paramRecId: 'smaily_rec',
        paramVisitor: 'smaily_vt',
        paramContext: 'smaily_ctx',
        cookieRecId: 'smaily_rec_id',
        cookieVisitor: 'smaily_rec_uid',
        cookieContext: 'smaily_rec_ctx',
        cookieSession: 'smaily_anon_sid',
        ttlRecIdDays: 30,
        ttlVisitorDays: 365,
        ttlContextDays: 30,
        ttlSessionDays: 30,
        landUrl: 'https://store.example/smaily/attribution/land/'
    };

    // Runs in the frame before the script under test: the landing's query,
    // the cookies the shopper already holds and the store route's answer
    // ('stored': 204, 'error': 500, 'offline': the request fails).
    function stubs(query, cookies, route) {
        return [
            'var requests = [];',
            'window.fetch = function (url, init) { requests.push({url: url, init: init});',
            '  return ' + JSON.stringify(route) + ' === "offline" ? Promise.reject(new TypeError("offline"))',
            '    : Promise.resolve({ok: ' + JSON.stringify(route) + ' === "stored"}); };',
            'var RealParams = URLSearchParams;',
            'window.URLSearchParams = function () { return new RealParams(' + JSON.stringify(query) + '); };',
            'var jar = ' + JSON.stringify(cookies) + ';',
            'Object.defineProperty(document, "cookie", {configurable: true,',
            '  get: function () { return Object.keys(jar).map(function (k) { return k + "=" + jar[k]; }).join("; "); },',
            '  set: function (v) { var parts = v.split(";"), pair = parts[0], i = pair.indexOf("="),',
            '    expires = parts.filter(function (p) { return /^\\s*expires=/i.test(p); })[0];',
            '    if (expires && Date.parse(expires.split("=")[1]) <= Date.now()) { delete jar[pair.slice(0, i)]; }',
            '    else { jar[pair.slice(0, i)] = pair.slice(i + 1); } }});'
        ].join('\n');
    }

    function lumaFrame(config, runs) {
        return [
            '<script>',
            'var factory;',
            'function define(deps, f) { factory = f; }',
            'define.amd = {};',
            '<\/script>',
            '<script src="../../view/frontend/web/js/attribution.js"><\/script>',
            '<script>var capture = factory();<\/script>',
            '<script>capture(' + JSON.stringify(config) + ');<\/script>'
        ].concat(runs > 1 ? ['<script>capture(' + JSON.stringify(config) + ');<\/script>'] : []).join('\n');
    }

    // A second run is the tracker's (window.smailyAttribution).
    function hyvaFrame(config, runs) {
        return [
            '<script type="application/json" id="smaily-attribution-config">'
                + JSON.stringify(config) + '<\/script>',
            '<script src="../../compat/hyva/view/frontend/web/js/smaily-attribution.js"><\/script>'
        ].concat(runs > 1 ? ['<script>window.smailyAttribution(' + JSON.stringify(config) + ');<\/script>'] : [])
            .join('\n');
    }

    // Lands on a page with the given query and cookies; resolves with the
    // cookies the page leaves behind once the store route has answered, and
    // the requests made to it. options: route (default 'offline': the
    // script writes the cookies itself), config, runs (2: the tracker runs
    // the capture again).
    function land(theme, query, cookies, options) {
        var route = (options && options.route) || 'offline',
            config = (options && options.config) || CONFIG,
            runs = (options && options.runs) || 1;

        return new Promise(function (resolve, reject) {
            var frame = document.createElement('iframe');

            frame.onload = function () {
                setTimeout(function () {
                    try {
                        var jar = Object.assign({}, frame.contentWindow.jar);

                        jar.requests = frame.contentWindow.requests.slice();
                        frame.remove();
                        resolve(jar);
                    } catch (error) {
                        reject(error);
                    }
                }, 50);
            };
            frame.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><script>'
                + stubs(query, cookies, route) + '<\/script>'
                + (theme === 'Luma' ? lumaFrame(config, runs) : hyvaFrame(config, runs))
                + '</head><body></body></html>';
            document.body.appendChild(frame);
        });
    }

    async function run(theme) {
        var before = {smaily_rec_id: OLD_REC_ID, smaily_rec_ctx: 'storefront'},
            jar;

        log('# ' + theme);

        jar = await land(theme, '?smaily_rec=' + REC_ID + '&smaily_ctx=cart_abandoned', before);
        check(theme + ', a recommendation link with a context: the rec id cookie holds its rec id',
            jar.smaily_rec_id === REC_ID);
        check(theme + ', a recommendation link with a context: the context cookie holds its context',
            jar.smaily_rec_ctx === 'cart_abandoned');

        jar = await land(theme, '?smaily_rec=' + REC_ID + '&smaily_ctx=welcome', {});
        check(theme + ', a first recommendation link with a context: the context cookie holds its context',
            jar.smaily_rec_ctx === 'welcome');

        jar = await land(theme, '?smaily_rec=' + REC_ID, before);
        check(theme + ', a recommendation link without a context: the rec id cookie holds its rec id',
            jar.smaily_rec_id === REC_ID);
        check(theme + ', a recommendation link without a context: the context cookie is cleared',
            !('smaily_rec_ctx' in jar));

        jar = await land(theme, '?utm_source=smaily&utm_content=' + REC_ID, before);
        check(theme + ', a utm_content recommendation link without a context: the context cookie is cleared',
            jar.smaily_rec_id === REC_ID && !('smaily_rec_ctx' in jar));

        jar = await land(theme, '', before);
        check(theme + ', a landing without a recommendation link: both cookies are unchanged',
            jar.smaily_rec_id === OLD_REC_ID && jar.smaily_rec_ctx === 'storefront');

        jar = await land(theme, '?smaily_ctx=welcome', before);
        check(theme + ', a context without a recommendation link: both cookies are unchanged',
            jar.smaily_rec_id === OLD_REC_ID && jar.smaily_rec_ctx === 'storefront');

        jar = await land(theme, '?smaily_rec=rec_abc123&smaily_ctx=welcome', before);
        check(theme + ', a malformed rec id: both cookies are unchanged',
            jar.smaily_rec_id === OLD_REC_ID && jar.smaily_rec_ctx === 'storefront');

        // A link carries the engine's vt_ token only (CON-177): a
        // store-created vs_ token in a link is refused, and a vs_ token the
        // cookie already holds stays.
        jar = await land(theme, '?smaily_vt=vt_8f3k2a', {});
        check(theme + ', an engine vt_ visitor token is written', jar.smaily_rec_uid === 'vt_8f3k2a');
        jar = await land(theme, '?smaily_vt=vt_' + 'A'.repeat(61), {});
        check(theme + ', an engine vt_ visitor token of 64 characters is written',
            jar.smaily_rec_uid === 'vt_' + 'A'.repeat(61));
        jar = await land(theme, '?smaily_vt=vs_4fK9a2LmQ7xZ0bR3tY8wP1', {});
        check(theme + ', a store-created vs_ visitor token in a link does not set the cookie',
            !('smaily_rec_uid' in jar));
        jar = await land(theme, '?smaily_vt=vs_4fK9a2LmQ7xZ0bR3tY8wP1', {smaily_rec_uid: 'vt_8f3k2a'});
        check(theme + ', a store-created vs_ visitor token in a link leaves a vt_ cookie unchanged',
            jar.smaily_rec_uid === 'vt_8f3k2a');
        jar = await land(theme, '?smaily_vt=vs_9QxR2mLk7aZ0bT3yW8pN1c', {smaily_rec_uid: 'vs_4fK9a2LmQ7xZ0bR3tY8wP1'});
        check(theme + ', a store-created vs_ visitor token in a link leaves the store\'s own vs_ cookie unchanged',
            jar.smaily_rec_uid === 'vs_4fK9a2LmQ7xZ0bR3tY8wP1');
        jar = await land(theme, '', {smaily_rec_uid: 'vs_4fK9a2LmQ7xZ0bR3tY8wP1'});
        check(theme + ', a landing without a visitor token leaves the store\'s own vs_ cookie unchanged',
            jar.smaily_rec_uid === 'vs_4fK9a2LmQ7xZ0bR3tY8wP1');
        jar = await land(theme, '?smaily_vt=vs_4fK9a2LmQ7', {smaily_rec_uid: 'vt_8f3k2a'});
        check(theme + ', a visitor token of neither form leaves the cookie unchanged',
            jar.smaily_rec_uid === 'vt_8f3k2a');

        // CON-211: the store's server sets the cookies, so Safari keeps them
        // for their lifetime; the script writes them only when that fails.
        // Every check above ran with the store route failing.
        jar = await land(theme, '?smaily_rec=' + REC_ID + '&smaily_ctx=cart_abandoned&smaily_vt=vt_8f3k2a',
            before, {route: 'stored'});
        check(theme + ', a recommendation link posts its values to the store route once',
            jar.requests.length === 1 && jar.requests[0].url === CONFIG.landUrl
                && jar.requests[0].init.method === 'POST'
                && jar.requests[0].init.credentials === 'same-origin'
                && jar.requests[0].init.body === 'rec_id=' + REC_ID + '&visitor_token=vt_8f3k2a&context=cart_abandoned');
        check(theme + ', the store route set the cookies: the script writes none',
            jar.smaily_rec_id === OLD_REC_ID && jar.smaily_rec_ctx === 'storefront' && !('smaily_rec_uid' in jar));

        jar = await land(theme, '?smaily_rec=' + REC_ID, before, {route: 'stored'});
        check(theme + ', a recommendation link without a context posts no context',
            jar.requests.length === 1 && jar.requests[0].init.body === 'rec_id=' + REC_ID);

        jar = await land(theme, '?smaily_vt=vt_8f3k2a&smaily_ctx=welcome', {}, {route: 'stored'});
        check(theme + ', a visitor token without a recommendation posts the token alone',
            jar.requests.length === 1 && jar.requests[0].init.body === 'visitor_token=vt_8f3k2a');

        jar = await land(theme, '', before, {route: 'stored'});
        check(theme + ', a landing without a recommendation link asks nothing', jar.requests.length === 0);
        jar = await land(theme, '?smaily_vt=vs_4fK9a2LmQ7xZ0bR3tY8wP1&smaily_rec=rec_abc123', {}, {route: 'stored'});
        check(theme + ', a vs_ token and a malformed rec id ask nothing', jar.requests.length === 0);

        jar = await land(theme, '?smaily_rec=' + REC_ID + '&smaily_vt=vt_8f3k2a', before, {route: 'error'});
        check(theme + ', the store route answers an error: the script writes the cookies itself',
            jar.requests.length === 1 && jar.smaily_rec_id === REC_ID && !('smaily_rec_ctx' in jar)
                && jar.smaily_rec_uid === 'vt_8f3k2a');

        jar = await land(theme, '?smaily_vt=vt_8f3k2a', {}, {route: 'stored', runs: 2});
        check(theme + ', the tracker running the capture again posts nothing more and writes no cookie',
            jar.requests.length === 1 && !('smaily_rec_uid' in jar));

        jar = await land(theme, '?smaily_vt=vt_8f3k2a', {},
            {route: 'stored', config: Object.assign({}, CONFIG, {landUrl: undefined})});
        check(theme + ', without a store route the script writes the cookies itself',
            jar.requests.length === 0 && jar.smaily_rec_uid === 'vt_8f3k2a');
    }

    // bin/test-js.sh runs the page on Chrome's virtual time, which jumps to
    // the end of its budget whenever no timer is pending, even while a frame
    // loads. A short interval keeps it stepping until the run ends.
    var keepAlive = setInterval(function () {}, 10);

    run('Luma').then(function () {
        return run('Hyvä');
    }).then(function () {
        document.getElementById('result').textContent = failures === 0 && passes > 0
            ? 'RESULT: PASS (' + passes + ' checks)'
            : 'RESULT: FAIL (' + failures + ' of ' + (passes + failures) + ' checks failed)';
    }).catch(function (error) {
        document.getElementById('result').textContent = 'RESULT: FAIL (' + error.message + ')';
    }).then(function () {
        clearInterval(keepAlive);
    });
</script>
</body>
</html>
