<!--
  Headless harness for the Campaign Intelligence palette on the extension's
  own screens (CON-376): the real templates, rendered by
  Test/Js/render-admin.php into Test/Js/build/, each in a fresh frame with
  the admin stylesheet (its text, from build/smaily-admin-css.js, so the
  page can read its rules). Before it, a stand-in for Magento's own button
  styles (orange .action-primary, darker with a blue ring on hover and
  focus), and beside the page a native .action-primary outside .smaily-ui,
  as Magento's page actions are.

  Checked: the token sheet holds the palette, and no other rule writes a
  palette colour itself; the status colours keep their values. Our primary
  button (Settings > Connection's Save) reads the primary token and is
  #5E3B72 with white text, #4A2D5C when focused; the native button keeps
  Magento's orange, focused too; every rule of the stylesheet that names
  .action-primary is scoped to one of our containers. The Campaign
  Intelligence banner and the Smaily invitation draw their heading in plum,
  their call to action from plum to primary with white text and their card
  in the selected tint; the invitation's link is brand text. Every text
  colour set from the palette meets WCAG AA (4.5:1) on its background.

  The colours carry no text, so en_US alone is checked. Run it with
  bin/test-js.sh (it renders the pages first); the page ends with
  "RESULT: PASS" or "RESULT: FAIL".
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>brand palette harness</title>
    <script src="build/smaily-admin-css.js"></script>
    <script src="build/settings-website.en_US.js"></script>
    <script src="build/ci-banner-dashboard.en_US.js"></script>
    <script src="build/invite-dashboard.en_US.js"></script>
</head>
<body>
<pre id="log"></pre>
<div id="result">RESULT: RUNNING</div>
<script>
    'use strict';

    // Magento's own button styles, as its admin stylesheet (loaded before
    // ours) sets them.
    var MAGENTO_CSS = '.action-primary { background-color: #eb5202; border: 1px solid #eb5202; color: #fff; }'
        + ' .action-primary:hover, .action-primary:active, .action-primary:focus'
        + ' { background-color: #ba4000; border-color: #b84002; box-shadow: 0 0 0 1px #007bdb; color: #fff; }';
    var NATIVE = '<div class="page-actions"><button type="button" class="action-primary" id="native">Save Config</button></div>';
    var PALETTE = {
        '--s-primary': '#5e3b72',
        '--s-primary-hover': '#4a2d5c',
        '--s-on-primary': '#ffffff',
        '--s-brand-text': '#4a2d5c',
        '--s-plum': '#2a1028',
        '--s-magenta': '#e91e63',
        '--s-selected': '#efe5fb',
        '--s-selected-border': '#e2d3f6'
    };
    var STATUS = {
        '--s-success': '#1f7a34', '--s-warning': '#8a5a00', '--s-danger': '#bb2b0e', '--s-info': '#0f5a94',
        '--s-bar-success': '#4caf50', '--s-bar-info': '#1979c3', '--s-bar-warning': '#e0a800', '--s-bar-error': '#d72c0d'
    };
    var PRIMARY = 'rgb(94, 59, 114)';
    var PRIMARY_HOVER = 'rgb(74, 45, 92)';
    var BRAND_TEXT = 'rgb(74, 45, 92)';
    var PLUM = 'rgb(42, 16, 40)';
    var SELECTED = 'rgb(239, 229, 251)';
    var SELECTED_BORDER = 'rgb(226, 211, 246)';
    var WHITE = 'rgb(255, 255, 255)';
    var failures = 0;
    var passes = 0;

    // Chrome's virtual time jumps to the end of its budget when no timer is
    // pending; a running interval keeps it stepping until the result is
    // written (as in tracker-consent.html).
    var keepAlive = setInterval(function () {}, 10);

    function log(line) {
        document.getElementById('log').textContent += line + '\n';
    }

    function check(label, condition) {
        if (condition) {
            passes++;
            log('ok   ' + label);
        } else {
            failures++;
            log('FAIL ' + label);
        }
    }

    function rendered(page) {
        var found = (window.smailyAdminPages || {})[page];

        if (!found) {
            throw new Error('Test/Js/build/' + page + '.js is missing; bin/test-js.sh renders it');
        }

        return found.html;
    }

    // The page in a frame after Magento's stand-in and the admin stylesheet,
    // its scripts left out (only the markup and the styles are checked),
    // with a native button beside it.
    function open(page) {
        return new Promise(function (resolve) {
            var frame = document.createElement('iframe');

            frame.style.width = '1200px';
            frame.style.height = '900px';
            frame.onload = function () {
                resolve(frame.contentDocument);
            };
            frame.srcdoc = '<!doctype html><html><head><meta charset="utf-8">'
                + '<style>' + MAGENTO_CSS + '</style>'
                + '<style id="admin-css">' + window.smailyAdminCss + '</style>'
                + '</head><body style="margin:20px;background:#fff">' + NATIVE
                + rendered(page).replace(/<script[\s\S]*?<\/script>/g, '')
                + '</body></html>';
            document.body.appendChild(frame);
        });
    }

    function style(element) {
        return element.ownerDocument.defaultView.getComputedStyle(element);
    }

    // Every style rule of the admin stylesheet, those inside @media too.
    function styleRules(doc) {
        var out = [];

        Array.prototype.forEach.call(doc.getElementById('admin-css').sheet.cssRules, function (rule) {
            if (rule.cssRules && rule.media) {
                Array.prototype.forEach.call(rule.cssRules, function (inner) {
                    out.push(inner);
                });
            } else if (rule.selectorText) {
                out.push(rule);
            }
        });

        return out;
    }

    // WCAG 2 contrast ratio of two computed rgb() colours.
    function contrast(a, b) {
        function luminance(rgb) {
            var c = rgb.match(/\d+/g).slice(0, 3).map(function (v) {
                v = v / 255;

                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });

            return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
        }
        var x = luminance(a), y = luminance(b);

        return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
    }

    function aa(label, fg, bg) {
        var ratio = contrast(fg, bg);

        check('AA: ' + label + ' (' + ratio.toFixed(2) + ':1)', ratio >= 4.5);
    }

    // A call to action from plum to primary with white text, in palette
    // colours only.
    function ctaInPalette(cta) {
        var image = style(cta).backgroundImage;

        return image.indexOf(PLUM) !== -1 && image.indexOf(PRIMARY) !== -1
            && style(cta).color === WHITE;
    }

    function run() {
        return open('settings-website.en_US').then(function (doc) {
            var root = style(doc.documentElement),
                rules = styleRules(doc),
                outside = window.smailyAdminCss.replace(/:root\s*\{[\s\S]*?\}/, ''),
                save = doc.getElementById('smaily-w-connection-save'),
                native = doc.getElementById('native'),
                primaryRule = rules.filter(function (rule) {
                    return rule.selectorText === '.smaily-ui .action-primary';
                })[0],
                unscoped,
                muted;

            check('the token sheet holds the palette', Object.keys(PALETTE).every(function (name) {
                return root.getPropertyValue(name).trim() === PALETTE[name];
            }));
            check('no rule outside the token sheet writes a palette colour itself',
                Object.keys(PALETTE).every(function (name) {
                    return PALETTE[name] === '#ffffff' || outside.toLowerCase().indexOf(PALETTE[name]) === -1;
                }));
            check('the status colours keep their values', Object.keys(STATUS).every(function (name) {
                return root.getPropertyValue(name).trim() === STATUS[name];
            }));

            check('our primary button rule reads the primary token',
                !!primaryRule && primaryRule.cssText.indexOf('background: var(--s-primary);') !== -1
                && primaryRule.cssText.indexOf('color: var(--s-on-primary);') !== -1);
            check('our primary button is the primary, white text',
                !!save && save.closest('.smaily-ui') !== null
                && style(save).backgroundColor === PRIMARY && style(save).borderTopColor === PRIMARY
                && style(save).color === WHITE);
            check('the native button outside .smaily-ui keeps Magento\'s orange',
                native.closest('.smaily-ui') === null
                && style(native).backgroundColor === 'rgb(235, 82, 2)' && style(native).color === WHITE);

            unscoped = rules.filter(function (rule) {
                return rule.selectorText.split(',').some(function (selector) {
                    return selector.indexOf('action-primary') !== -1 && !/^\s*\.smaily-[\w-]+\s/.test(selector);
                });
            }).map(function (rule) {
                return rule.selectorText;
            });
            check('every .action-primary rule is scoped to one of our containers'
                + (unscoped.length ? ' (not: ' + unscoped.join(' | ') + ')' : ''), unscoped.length === 0);

            // Hover, press and focus share one rule: focus stands for all.
            doc.querySelector('.smaily-tab-panel[data-tab="connection"]').style.display = 'block';
            save.focus();
            check('focused, our primary button is the darker primary with no blue ring',
                doc.activeElement === save && style(save).backgroundColor === PRIMARY_HOVER
                && style(save).boxShadow === 'none' && style(save).color === WHITE);
            native.focus();
            check('focused, the native button keeps Magento\'s darker orange and blue ring',
                doc.activeElement === native && style(native).backgroundColor === 'rgb(186, 64, 0)'
                && style(native).boxShadow.indexOf('rgb(0, 123, 219)') !== -1);

            aa('white on the primary button', WHITE, PRIMARY);
            aa('white on the focused primary button', WHITE, PRIMARY_HOVER);
            aa('brand text links on white', BRAND_TEXT, WHITE);
            aa('brand text links on the grey canvas', BRAND_TEXT, 'rgb(244, 244, 244)');
            aa('plum link hover on white', PLUM, WHITE);
            aa('primary step number on white', PRIMARY, WHITE);
            aa('card title on the selected tint', 'rgb(48, 48, 48)', SELECTED);
            aa('card description on the selected tint', 'rgb(90, 90, 90)', SELECTED);

            // CON-365: the lightest text (notes, captions) on white, the grey
            // canvas and the selected tint, where a note can sit.
            muted = doc.createElement('span');
            muted.style.color = 'var(--s-text-3)';
            doc.body.appendChild(muted);
            aa('the lightest text on white', style(muted).color, WHITE);
            aa('the lightest text on the grey canvas', style(muted).color, 'rgb(244, 244, 244)');
            aa('the lightest text on the selected tint', style(muted).color, SELECTED);
        }).then(function () {
            return open('ci-banner-dashboard.en_US');
        }).then(function (doc) {
            var banner = doc.querySelector('.smaily-ci-banner'),
                cta = banner.querySelector('.smaily-ci-banner__cta:not([hidden])'),
                title = banner.querySelector('.smaily-ci-banner__title'),
                accent = banner.querySelector('.smaily-ci-banner__accent'),
                note = banner.querySelector('.smaily-ci-banner__note'),
                heading = banner.querySelector('.smaily-ci-banner__panel-heading'),
                chip = banner.querySelector('.smaily-ci-banner__chip');

            check('banner: the card in the selected tint with its border',
                style(banner).backgroundImage.indexOf(SELECTED) !== -1
                && style(banner).borderTopColor === SELECTED_BORDER && style(banner).color === PLUM);
            check('banner: the heading in plum, "Intelligence" in the primary',
                style(title).color === PLUM && style(accent).color === PRIMARY);
            check('banner: the call to action from plum to primary, white text', !!cta && ctaInPalette(cta));
            aa('banner text and heading in plum on the selected tint', PLUM, SELECTED);
            aa('"Intelligence" in the primary on the selected tint', PRIMARY, SELECTED);
            aa('white on the call to action, at its plum end', WHITE, PLUM);
            aa('white on the call to action, at its primary end', WHITE, PRIMARY);
            aa('white on the plum "Requires a paid Smaily plan" pill', WHITE, PLUM);
            aa('the note\'s link in brand text on the selected tint', BRAND_TEXT, SELECTED);
            aa('the note on the selected tint', style(note).color, SELECTED);
            // CON-365: the illustration's heading on its white panel over the
            // selected tint, and the chip text on the chip.
            aa('the panel heading on white', style(heading).color, WHITE);
            aa('the panel heading on the selected tint', style(heading).color, SELECTED);
            aa('the chip text on the chip', style(chip).color, style(chip).backgroundColor);
        }).then(function () {
            return open('invite-dashboard.en_US');
        }).then(function (doc) {
            var banner = doc.querySelector('.smaily-ci-banner--smaily'),
                link = banner.querySelector('a.smaily-ci-banner__link');

            check('invitation: the heading in plum', style(banner.querySelector('.smaily-ci-banner__title')).color === PLUM);
            check('invitation: the call to action from plum to primary, white text',
                ctaInPalette(banner.querySelector('.smaily-ci-banner__cta')));
            check('invitation: "Create a Smaily account" in brand text', style(link).color === BRAND_TEXT);
            aa('"Create a Smaily account" in brand text on the selected tint', BRAND_TEXT, SELECTED);
        });
    }

    run().then(function () {
        document.getElementById('result').textContent = failures === 0 && passes > 0
            ? 'RESULT: PASS (' + passes + ' checks)'
            : 'RESULT: FAIL (' + failures + ' of ' + (passes + failures) + ' checks failed)';
    }, function (error) {
        document.getElementById('result').textContent = 'RESULT: FAIL (' + error.message + ')';
    }).then(function () {
        clearInterval(keepAlive);
    });
</script>
</body>
</html>
